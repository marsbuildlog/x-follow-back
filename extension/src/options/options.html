<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Refollow 控制台</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 14px/1.6 -apple-system, system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 20px; color: #0f1419; }
    h1 { font-size: 20px; } h2 { font-size: 16px; margin: 24px 0 8px; border-bottom: 1px solid #e1e8ed; padding-bottom: 4px; }
    section { margin-bottom: 8px; }
    button { padding: 6px 14px; border: 1px solid #1d9bf0; background: #1d9bf0; color: #fff; border-radius: 16px; cursor: pointer; font-size: 13px; margin-right: 8px; margin-bottom: 8px; }
    button:hover { background: #1a8cd8; }
    button.ghost { background: #fff; color: #1d9bf0; }
    button.ghost:hover { background: #e8f5fd; }
    button.danger { background: #fff; color: #d33; border-color: #d33; }
    button.danger:hover { background: #fdecec; }
    .tabs { display: flex; gap: 4px; margin-bottom: -1px; }
    .tab { padding: 6px 18px; border: 1px solid #e1e8ed; border-bottom: none; border-radius: 8px 8px 0 0; background: #f7f9f9; color: #536471; cursor: pointer; font-size: 13px; }
    .tab.active { background: #fff; color: #0f1419; font-weight: 700; border-color: #cbd3d9; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #e1e8ed; padding: 4px 8px; text-align: left; }
    th { background: #f7f9f9; position: sticky; top: 0; }
    #queue-wrap { height: 300px; overflow: auto; border-bottom: 1px solid #e1e8ed; }
    pre { background: #0f1419; color: #d7dbdc; padding: 12px; border-radius: 8px; font-size: 12px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
    #log { height: 300px; }
    .hint { color: #536471; font-size: 12px; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .st-pending { background: #fff4d6; color: #8a6d00; } .st-done { background: #d8f3dc; color: #1b5e20; }
    .st-failed { background: #fde2e2; color: #b02a37; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .set { margin-bottom: 14px; }
    .set-line { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    input[type=number] { width: 80px; padding: 4px 6px; }
    #tab-warn { background: #fff4d6; padding: 8px 12px; border-radius: 8px; color: #8a6d00; display: none; }
  </style>
</head>
<body>
  <h1>Refollow 控制台 <a href="https://marsbuildlog.github.io/refollow/" target="_blank" class="hint" style="font-size:13px;font-weight:400">使用说明 ↗</a></h1>
  <div id="tab-warn">未检测到打开的 x.com 标签页——输入你的用户名打开认证粉丝页, 或手动打开 https://x.com 并登录。
    <div class="row" style="margin-top:8px">
      <input id="quick-handle" placeholder="你的X用户名(不带@)" style="padding:6px 10px;border:1px solid #cbd3d9;border-radius:8px;font-size:13px;" />
      <button id="btn-quick-open">打开认证粉丝页</button>
    </div>
  </div>

  <h2>任务</h2>
  <section><span id="task-state" class="hint"></span></section>
  <!-- 启动/更新列表只在认证粉丝页的悬浮控件上(任务跑在页面里, 操作跟着页面走);
       控制台只留跨页面可用的遥控: 暂停/恢复(账号导航走时控件不在, 任务仍在跑) + 重置(仅此处有) -->
  <section class="row">
    <button id="btn-pause" class="ghost">暂停</button>
    <button id="btn-resume" class="ghost">恢复</button>
    <button id="btn-reset" class="danger">重置任务</button>
    <span id="op-result" class="hint"></span>
  </section>

  <h2>回关队列</h2>
  <div class="tabs">
    <button class="tab active" data-tab="todo">待处理 / 失败 <span id="cnt-todo"></span></button>
    <button class="tab" data-tab="done">已完成 <span id="cnt-done"></span></button>
  </div>
  <div id="queue-wrap">
    <table id="queue-table">
      <thead><tr><th style="width:70px">状态</th><th style="width:140px">账号</th><th>昵称</th><th>出错信息</th><th style="width:110px">完成时间</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="hint" id="queue-summary"></div>

  <h2>设置</h2>
  <section>
    <div class="set">
      <div class="set-line">关注间隔 <input type="number" id="s-intervalMin" /> ~ <input type="number" id="s-intervalMax" /> 秒</div>
      <div class="hint">每次回关之间随机等待这个区间, 模拟人工节奏(默认 3~8 秒)</div>
    </div>
    <div class="set">
      <div class="set-line">自动拉取间隔 <input type="number" id="s-autoFetchMin" /> 分钟</div>
      <div class="hint">打开认证粉丝页且距上次拉取超过该时长时自动补拉新粉; 点「更新列表」会重新计时(默认 30 分钟)</div>
    </div>
    <button id="btn-save-settings">保存设置</button>
    <span id="settings-result" class="hint"></span>
  </section>
  <div class="hint">
    其余保护机制(限流退避、连续失败熔断、模板过期暂停等)自动运行, 无需配置; 暂停时会发系统通知。
  </div>

  <h2>日志</h2>
  <details open><summary>展开/收起</summary><pre id="log"></pre></details>

  <script src="../shared/constants.js"></script>
  <script src="options.js"></script>
</body>
</html>
